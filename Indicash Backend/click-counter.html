<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .counter-display {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="counter-display">
        Click Count: <span id="clickCount">0</span>
    </div>

    <button onclick="incrementCounter()">Click Me!</button>
    <button onclick="resetCounter()">Reset</button>

    <script>
        let count = 0;

        function incrementCounter() {
            count++;
            document.getElementById("clickCount").innerText = count;
        }

        function resetCounter() {
            count = 0;
            document.getElementById("clickCount").innerText = count;
        }
    </script>

</body>
</html>
